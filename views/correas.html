<script>
const modal = document.getElementById("modal");
const modalImg = document.getElementById("modal-img");

const images = document.querySelectorAll(".zoom-img");

images.forEach(img => {
  img.addEventListener("click", () => {
    modal.style.display = "flex";
    modalImg.src = img.src;
  });
});

modal.addEventListener("click", () => {
  modal.style.display = "none";
});
</script>

<script>
const searchInput = document.getElementById("searchInput");

// cada producto real es el bloque "about-text"
const items = document.querySelectorAll(".about-text");

searchInput.addEventListener("input", function () {
  const value = this.value.toLowerCase();

  items.forEach(item => {
    const title = item.querySelector("h3").textContent.toLowerCase();

    // ocultar o mostrar TODO el bloque (imagen + texto)
    const wrapper = item.previousElementSibling?.classList.contains("zoom-img")
      ? item.parentElement
      : item;

    if (title.includes(value)) {
      item.style.display = "block";
      if (item.previousElementSibling) {
        item.previousElementSibling.style.display = "block";
      }
    } else {
      item.style.display = "none";
      if (item.previousElementSibling) {
        item.previousElementSibling.style.display = "none";
      }
    }
  });
});
</script>
